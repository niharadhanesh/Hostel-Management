<!-- templates/admin_base.html -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin Panel{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f1f5f9;
}

.sidebar{
    width:260px;
    height:100vh;
    background:linear-gradient(180deg,#0f172a,#1e293b);
    position:fixed;
    left:0;
    top:0;
    padding:25px 15px;
}

.sidebar h3{
    color:#fff;
    text-align:center;
    margin-bottom:30px;
    font-weight:700;
}

.sidebar a{
    display:block;
    color:#cbd5e1;
    text-decoration:none;
    padding:12px 15px;
    margin-bottom:10px;
    border-radius:12px;
    transition:0.3s;
}

.sidebar a:hover{
    background:#38bdf8;
    color:#fff;
}

.main{
    margin-left:260px;
    padding:30px;
}

.topbar{
    background:#fff;
    padding:18px 25px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,0.06);
    margin-bottom:25px;
}

.content-box{
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

@media(max-width:768px){
.sidebar{
    width:100%;
    height:auto;
    position:relative;
}
.main{
    margin-left:0;
}
}
</style>
</head>
<body>

<div class="sidebar">
    <h3>Hostel Admin</h3>

    <a href="{%  url 'admin_dashboard' %}">Dashboard</a>
     <a href="{% url 'student_list' %}">Students</a>
    <a href="{% url 'rooms' %}">Rooms</a>
    <a href="{% url 'rent' %}">Rent</a>
    <a href="#">Complaints</a>
    <a href="#">Visitors</a>
    <a href="{% url 'logout' %}">Logout</a>
</div>

<div class="main">

    <div class="topbar">
        <h4 class="mb-0">Welcome Admin</h4>
    </div>

    <div class="content-box">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
