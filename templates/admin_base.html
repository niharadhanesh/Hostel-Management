<!-- templates/admin_base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin Panel{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    :root {
        --bg:         #0e1526;
        --bg-surface: #141d33;
        --bg-card:    rgba(255,255,255,0.04);
        --sidebar-w:  240px;
        --border:     rgba(255,255,255,0.08);
        --accent:     #c7936e;
        --accent-lt:  rgba(199,147,112,0.12);
        --accent-dk:  #b07a57;
        --accent-glow:rgba(199,147,112,0.15);
        --text:       #f0ece4;
        --muted:      #7c8ba3;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        background-image:
            radial-gradient(ellipse 60% 55% at 15% 0%,  rgba(199,147,112,0.07) 0%, transparent 70%),
            radial-gradient(ellipse 50% 60% at 85% 100%, rgba(80,100,180,0.08) 0%, transparent 70%);
    }

    /* ── Bubbles ── */
    .bubbles {
        position: fixed;
        bottom: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
    }

    .bubble {
        position: absolute;
        bottom: -120px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, rgba(199,147,112,0.35), rgba(199,147,112,0.06));
        border: 1px solid rgba(199,147,112,0.18);
        animation: rise linear infinite;
    }

    @keyframes rise {
        0%   { transform: translateY(0) translateX(0) scale(1);    opacity: 0; }
        5%   { opacity: 1; }
        90%  { opacity: 0.6; }
        100% { transform: translateY(-110vh) translateX(30px) scale(1.1); opacity: 0; }
    }

    .bubble:nth-child(1)  { left:  5%; width:18px; height:18px; animation-duration:9s;  animation-delay:0s;   }
    .bubble:nth-child(2)  { left: 12%; width:28px; height:28px; animation-duration:12s; animation-delay:1.5s; }
    .bubble:nth-child(3)  { left: 20%; width:14px; height:14px; animation-duration:8s;  animation-delay:3s;   }
    .bubble:nth-child(4)  { left: 30%; width:22px; height:22px; animation-duration:11s; animation-delay:0.5s; }
    .bubble:nth-child(5)  { left: 40%; width:10px; height:10px; animation-duration:7s;  animation-delay:2s;   }
    .bubble:nth-child(6)  { left: 50%; width:30px; height:30px; animation-duration:14s; animation-delay:4s;   }
    .bubble:nth-child(7)  { left: 58%; width:16px; height:16px; animation-duration:9s;  animation-delay:1s;   }
    .bubble:nth-child(8)  { left: 66%; width:24px; height:24px; animation-duration:10s; animation-delay:5s;   }
    .bubble:nth-child(9)  { left: 74%; width:12px; height:12px; animation-duration:8s;  animation-delay:2.5s; }
    .bubble:nth-child(10) { left: 82%; width:20px; height:20px; animation-duration:13s; animation-delay:0s;   }
    .bubble:nth-child(11) { left: 88%; width:26px; height:26px; animation-duration:11s; animation-delay:3.5s; }
    .bubble:nth-child(12) { left: 93%; width:14px; height:14px; animation-duration:7s;  animation-delay:1s;   }
    .bubble:nth-child(13) { left: 22%; width:32px; height:32px; animation-duration:15s; animation-delay:6s;   }
    .bubble:nth-child(14) { left: 47%; width:18px; height:18px; animation-duration:10s; animation-delay:4.5s; }
    .bubble:nth-child(15) { left: 70%; width:22px; height:22px; animation-duration:12s; animation-delay:2s;   }

    /* ── Sidebar ── */
    .sidebar {
        position: fixed;
        left: 0; top: 0;
        width: var(--sidebar-w);
        height: 100vh;
        background: rgba(10,14,28,0.85);
        backdrop-filter: blur(20px);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 28px 16px;
        z-index: 10;
        overflow-y: auto;
    }

    .sidebar-brand {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--text);
        text-align: center;
        letter-spacing: 0.5px;
        padding-bottom: 20px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
    }

    .sidebar-brand span { color: var(--accent); }

    .sidebar-label {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 12px;
        margin: 18px 0 8px;
    }

    .sidebar a {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 2px;
        transition: background 0.2s, color 0.2s;
    }

    .sidebar a .nav-icon {
        width: 18px;
        text-align: center;
        font-size: 15px;
        flex-shrink: 0;
    }

    .sidebar a:hover {
        background: var(--accent-lt);
        color: var(--accent);
    }

    .sidebar a.active {
        background: var(--accent-lt);
        color: var(--accent);
        border-left: 2px solid var(--accent);
    }

    .sidebar-logout {
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid var(--border);
    }

    .sidebar-logout a {
        color: rgba(199,147,112,0.6) !important;
    }

    .sidebar-logout a:hover {
        color: var(--accent) !important;
        background: rgba(199,147,112,0.08) !important;
    }

    /* ── Main ── */
    .main {
        margin-left: var(--sidebar-w);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 1;
    }

    /* ── Topbar ── */
    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 32px;
        background: rgba(14,21,38,0.75);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 5;
    }

    .topbar-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--text);
    }

    .topbar-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--accent-lt);
        border: 1px solid rgba(199,147,112,0.2);
        padding: 6px 14px;
        border-radius: 50px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--accent);
    }

    .topbar-dot {
        width: 7px; height: 7px;
        background: var(--accent);
        border-radius: 50%;
        animation: blink 2s infinite;
    }

    @keyframes blink {
        0%,100% { opacity:1; } 50% { opacity:0.3; }
    }

    /* ── Content area ── */
    .content-wrap {
        flex: 1;
        padding: 28px 32px;
    }

    .content-box {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        backdrop-filter: blur(12px);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
        .sidebar {
            position: relative;
            width: 100%;
            height: auto;
            flex-direction: row;
            flex-wrap: wrap;
            padding: 16px;
            gap: 6px;
        }

        .sidebar-brand { width: 100%; margin-bottom: 8px; padding-bottom: 12px; }
        .sidebar-label { display: none; }
        .sidebar-logout { margin-top: 0; padding-top: 0; border-top: none; }

        .sidebar a { padding: 8px 12px; font-size: 0.8rem; }

        .main { margin-left: 0; }

        .topbar, .content-wrap { padding: 16px 18px; }
    }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">Hostel<span>MS</span></div>

    <span class="sidebar-label">Main</span>
    <a href="{% url 'admin_dashboard' %}">
        <span class="nav-icon">⚡</span> Dashboard
    </a>

    <span class="sidebar-label">Management</span>
    <a href="{% url 'student_list' %}">
        <span class="nav-icon">👥</span> Students
    </a>
    <a href="{% url 'rooms' %}">
        <span class="nav-icon">🏠</span> Rooms
    </a>
    <a href="{% url 'rent' %}">
        <span class="nav-icon">💳</span> Rent
    </a>
    <a href="{% url 'admin_complaints' %}">
        <span class="nav-icon">📋</span> Complaints
    </a>
    <a href="#">
        <span class="nav-icon">🪪</span> Visitors
    </a>

    <div class="sidebar-logout">
        <a href="{% url 'logout' %}">
            <span class="nav-icon">🚪</span> Logout
        </a>
    </div>
</div>

<!-- Main -->
<div class="main">

    <div class="topbar">
        <span class="topbar-title">{% block page_title %}Admin Panel{% endblock %}</span>
        <div class="topbar-badge">
            <span class="topbar-dot"></span> Admin
        </div>
    </div>

    <div class="content-wrap">
        <div class="content-box">
            {% block content %}
            {% endblock %}
        </div>
    </div>

</div>

</body>
</html>
