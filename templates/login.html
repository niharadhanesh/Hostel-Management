<!-- templates/login.html -->
{% extends 'base.html' %}

{% block title %}Login — HostelMS{% endblock %}

{% block content %}
<div class="card-box">

    <div class="card-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="13" r="6" stroke="#c7936e" stroke-width="1.8"/>
            <path d="M6 30c0-6.627 5.373-10 12-10s12 3.373 12 10" stroke="#c7936e" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
    </div>

    <span class="card-label">Welcome back</span>
    <h2>Sign In</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password">
        </div>

        <button type="submit" class="btn-custom">Sign In</button>
    </form>

    <div class="card-footer-text">
        Don't have an account? <a href="{% url 'register' %}">Create one</a>
    </div>
</div>

<style>
    .card-icon {
        width: 54px; height: 54px;
        background: rgba(199,147,112,0.1);
        border: 1px solid rgba(199,147,112,0.2);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
    }
</style>
{% endblock %}
