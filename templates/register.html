<!-- templates/register.html -->
{% extends 'base.html' %}

{% block title %}Register — HostelMS{% endblock %}

{% block content %}
<div class="card-box" style="max-width:460px">

    <div class="card-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="15" cy="13" r="5.5" stroke="#c7936e" stroke-width="1.8"/>
            <path d="M5 30c0-5.523 4.477-9 10-9" stroke="#c7936e" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M26 20v8M22 24h8" stroke="#c7936e" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
    </div>

    <span class="card-label">Get started</span>
    <h2>Create Account</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="d-flex gap-3">
            <div class="form-group w-50">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" class="form-control" placeholder="John">
            </div>
            <div class="form-group w-50">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Doe">
            </div>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com">
        </div>

        <div class="divider"></div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a password">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password">
        </div>

        <button type="submit" class="btn-custom">Create Account</button>
    </form>

    <div class="card-footer-text">
        Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </div>
</div>

<style>
    .card-icon {
        width: 54px; height: 54px;
        background: rgba(199,147,112,0.1);
        border: 1px solid rgba(199,147,112,0.2);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
    }
</style>
{% endblock %}
