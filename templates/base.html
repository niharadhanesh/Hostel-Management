<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hostel Management{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background: linear-gradient(135deg,#0f172a,#1e293b,#334155);
            min-height:100vh;
            color:white;
        }

        .navbar{
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }

        .navbar-brand{
            font-weight:700;
            color:#fff !important;
            letter-spacing:1px;
        }

        .nav-link{
            color:#ddd !important;
            transition:0.3s;
        }

        .nav-link:hover{
            color:#38bdf8 !important;
        }

        .main-content{
            min-height:90vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .card-box{
            background: rgba(255,255,255,0.08);
            border-radius:20px;
            padding:35px;
            width:100%;
            max-width:450px;
            box-shadow:0 10px 30px rgba(0,0,0,0.25);
            backdrop-filter: blur(12px);
        }

        .card-box h2{
            text-align:center;
            margin-bottom:25px;
            font-weight:700;
        }

        .form-control{
            border:none;
            border-radius:12px;
            padding:12px;
        }

        .btn-custom{
            background:#38bdf8;
            color:white;
            border:none;
            width:100%;
            padding:12px;
            border-radius:12px;
            font-weight:600;
        }

        .btn-custom:hover{
            background:#0ea5e9;
        }

        a{
            color:#38bdf8;
            text-decoration:none;
        }

        a:hover{
            color:#7dd3fc;
        }

        .footer{
            text-align:center;
            padding:15px;
            color:#cbd5e1;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg px-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">HostelMS</a>

        <div class="ms-auto">
            <a href="{% url 'login' %}" class="nav-link d-inline me-3">Login</a>
            <a href="{% url 'register' %}" class="nav-link d-inline">Register</a>
        </div>
    </div>
</nav>

<div class="main-content">
    {% block content %}
    {% endblock %}
</div>

<div class="footer">
    © 2026 Hostel Management System
</div>

</body>
</html>
