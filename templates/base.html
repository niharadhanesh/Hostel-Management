<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hostel Management{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:         #0e1526;
            --bg-surface: #141d33;
            --bg-card:    rgba(255,255,255,0.04);
            --border:     rgba(255,255,255,0.08);
            --border-hover: rgba(199,147,112,0.35);

            --accent:     #c7936e;
            --accent-lt:  rgba(199,147,112,0.12);
            --accent-dk:  #b07a57;
            --accent-glow: rgba(199,147,112,0.15);

            --text:       #f0ece4;
            --muted:      #7c8ba3;
            --subtle:     rgba(240,236,228,0.5);
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(ellipse 60% 55% at 15% 0%,  rgba(199,147,112,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 85% 100%, rgba(80,100,180,0.08) 0%, transparent 70%);
        }

        /* ── Navbar ── */
        .navbar {
            padding: 18px 40px;
            background: rgba(14,21,38,0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text) !important;
            letter-spacing: 1px;
        }

        .navbar-brand span { color: var(--accent); }

        .nav-actions a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-actions a:hover { color: var(--text); }

        .nav-actions .btn-nav {
            background: var(--accent);
            color: #0e1526 !important;
            font-weight: 600;
            padding: 7px 20px;
            border-radius: 8px;
            transition: background 0.2s, transform 0.15s;
        }

        .nav-actions .btn-nav:hover {
            background: var(--accent-dk);
            transform: translateY(-1px);
        }

        /* ── Main ── */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px 20px;
        }

        /* ── Card ── */
        .card-box {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 42px 38px;
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 64px rgba(0,0,0,0.35);
        }

        .card-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 2.8px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }

        .card-box h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 28px;
        }

        /* ── Form ── */
        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            font-size: 0.76rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .form-control {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .form-control::placeholder { color: rgba(124,139,163,0.6); }

        .form-control:focus {
            border-color: var(--accent);
            background: rgba(199,147,112,0.06);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ── Button ── */
        .btn-custom {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #0e1526;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 22px;
            letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.15s;
        }

        .btn-custom:hover { background: var(--accent-dk); transform: translateY(-1px); }
        .btn-custom:active { transform: translateY(0); }

        /* ── Footer text ── */
        .card-footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .card-footer-text a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .card-footer-text a:hover { text-decoration: underline; }

        .divider { height: 1px; background: var(--border); margin: 18px 0; }

        /* ── Site footer ── */
        .site-footer {
            text-align: center;
            padding: 16px;
            font-size: 0.76rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 480px) {
            .navbar { padding: 14px 20px; }
            .card-box { padding: 30px 22px; border-radius: 16px; }
        }
            /* ── Bubbles ── */
        .bubbles {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bubble {
            position: absolute;
            bottom: -120px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(199,147,112,0.35), rgba(199,147,112,0.06));
            border: 1px solid rgba(199,147,112,0.18);
            animation: rise linear infinite;
        }

        @keyframes rise {
            0%   { transform: translateY(0)   translateX(0)    scale(1);   opacity: 0; }
            5%   { opacity: 1; }
            90%  { opacity: 0.6; }
            100% { transform: translateY(-110vh) translateX(30px) scale(1.1); opacity: 0; }
        }

        /* stagger 15 bubbles */
        .bubble:nth-child(1)  { left:  5%; width: 18px; height: 18px; animation-duration: 9s;  animation-delay: 0s;    }
        .bubble:nth-child(2)  { left: 12%; width: 28px; height: 28px; animation-duration: 12s; animation-delay: 1.5s;  }
        .bubble:nth-child(3)  { left: 20%; width: 14px; height: 14px; animation-duration: 8s;  animation-delay: 3s;    }
        .bubble:nth-child(4)  { left: 30%; width: 22px; height: 22px; animation-duration: 11s; animation-delay: 0.5s;  }
        .bubble:nth-child(5)  { left: 40%; width: 10px; height: 10px; animation-duration: 7s;  animation-delay: 2s;    }
        .bubble:nth-child(6)  { left: 50%; width: 30px; height: 30px; animation-duration: 14s; animation-delay: 4s;    }
        .bubble:nth-child(7)  { left: 58%; width: 16px; height: 16px; animation-duration: 9s;  animation-delay: 1s;    }
        .bubble:nth-child(8)  { left: 66%; width: 24px; height: 24px; animation-duration: 10s; animation-delay: 5s;    }
        .bubble:nth-child(9)  { left: 74%; width: 12px; height: 12px; animation-duration: 8s;  animation-delay: 2.5s;  }
        .bubble:nth-child(10) { left: 82%; width: 20px; height: 20px; animation-duration: 13s; animation-delay: 0s;    }
        .bubble:nth-child(11) { left: 88%; width: 26px; height: 26px; animation-duration: 11s; animation-delay: 3.5s;  }
        .bubble:nth-child(12) { left: 93%; width: 14px; height: 14px; animation-duration: 7s;  animation-delay: 1s;    }
        .bubble:nth-child(13) { left: 22%; width: 32px; height: 32px; animation-duration: 15s; animation-delay: 6s;    }
        .bubble:nth-child(14) { left: 47%; width: 18px; height: 18px; animation-duration: 10s; animation-delay: 4.5s;  }
        .bubble:nth-child(15) { left: 70%; width: 22px; height: 22px; animation-duration: 12s; animation-delay: 2s;    }

        /* ensure page content sits above bubbles */
        .navbar, .main-content, .site-footer { position: relative; z-index: 1; }
    </style>
</head>
<body>

<div class="bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<nav class="navbar">
    <a class="navbar-brand" href="{% url 'index' %}">Hostel<span>MS</span></a>
    <div class="nav-actions d-flex align-items-center gap-3 ms-auto">
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}" class="btn-nav">Register</a>
    </div>
</nav>

<div class="main-content">
    {% block content %}{% endblock %}
</div>

<footer class="site-footer">
    © 2026 Hostel Management System
</footer>

</body>
</html>
